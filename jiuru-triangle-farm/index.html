<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九如三角窗小農地｜住商不動產 潮州新生加盟店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--g1:#1d6b3a;--g2:#124a27;--gold:#c9a45c;--bg:#f3f2ee;--ink:#22302a;--mut:#6b7a72;--line:#e2e0d8;--soft:#e8f1ea}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh}
.hero{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;padding:28px 22px 30px;text-align:center}
.pill{display:inline-block;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:4px 14px;font-size:13px;letter-spacing:.08em}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:30px;margin:18px 0 6px;letter-spacing:.04em}
.sub{font-size:14px;opacity:.85}
.price{margin-top:20px;font-family:"Noto Serif TC",serif;font-weight:900;font-size:56px;line-height:1}
.price small{font-size:22px;margin-left:4px}
.tag{display:inline-block;margin-top:12px;background:var(--gold);color:#3a2d0e;font-weight:700;font-size:13px;padding:3px 12px;border-radius:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.cell{background:#fff;border-radius:12px;padding:14px 12px;text-align:center;border:1px solid var(--line)}
.cell b{display:block;font-size:20px;color:var(--g1)}
.cell span{font-size:12px;color:var(--mut)}
section{padding:6px 16px 10px}
h2{font-size:16px;color:var(--g2);margin:14px 0 10px;padding-left:10px;border-left:4px solid var(--gold)}
.feat{list-style:none;display:grid;gap:8px}
.feat li{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:11px 14px;font-weight:500}
.feat svg{flex:none;width:22px;height:22px}
.info{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:1fr 1fr}
.row div{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.row div:nth-child(odd){color:var(--mut);background:#fafaf7}
.row:last-child div{border-bottom:none}
.line{display:block;margin:22px 16px 0;background:#06c755;color:#fff;text-decoration:none;text-align:center;border-radius:14px;padding:14px}
.line b{display:block;font-size:18px}
.line span{font-size:13px;opacity:.92}
footer{padding:18px 20px 32px;text-align:center;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="pill">住商不動產 潮州新生加盟店</span>
    <h1>九如三角窗小農地</h1>
    <p class="sub">農牧用地・一般農業區・雙面路</p>
    <div class="price">298<small>萬</small></div>
    <span class="tag">每坪約 1.7 萬</span>
  </header>

  <div class="grid">
    <div class="cell"><b>0.59 分</b><span>約 174.35 坪</span></div>
    <div class="cell"><b>4 m</b><span>臨路</span></div>
    <div class="cell"><b>61 m</b><span>面寬</span></div>
    <div class="cell"><b>31 m</b><span>縱深</span></div>
  </div>

  <section>
    <h2>物件特色</h2>
    <ul class="feat">
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#1d6b3a" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>雙面路</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#1d6b3a" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>近交流道</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#1d6b3a" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>大面寬</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#1d6b3a" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>休閒佳</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#1d6b3a" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>免道路持分</li>
    </ul>
  </section>

  <section>
    <h2>基本資料</h2>
    <div class="info">
      <div class="row"><div>總價</div><div>298 萬</div></div>
      <div class="row"><div>每坪單價</div><div>約 1.7 萬</div></div>
      <div class="row"><div>土地類別</div><div>農牧用地</div></div>
      <div class="row"><div>使用分區</div><div>一般農業區</div></div>
      <div class="row"><div>土地面積</div><div>174.35 坪（0.59 分）</div></div>
      <div class="row"><div>臨路</div><div>4 m</div></div>
      <div class="row"><div>面寬／縱深</div><div>61 m／31 m</div></div>
      <div class="row"><div>座向</div><div>座西北朝東南</div></div>
    </div>
  </section>

  <a class="line" href="https://lin.ee/Nw9K6J0" target="_blank" rel="noopener">
    <b>黃明鴻</b><span>加 LINE 詢問此物件</span>
  </a>

  <footer>本頁資料僅供參考，實際內容以『不動產說明書』為準。</footer>
</div>
</body>
</html>
